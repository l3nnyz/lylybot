spring.application.name=lylybotproject
spring.datasource.url=jdbc:mariadb://VOTRE_IP_SGBD:3306/dbChatBot?createDatabaseIfNotExist=true
spring.datasource.username=VOTRE_LOGIN_SGBD
spring.datasource.password=VOTRE_MDP_SGBD
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# Configuration de l'API Mistral
mistral.api.key=VOTRE KEY MISTRAL


# Configuration de l'API Gemini ?
gemini.api.key=VOTRE KEY GEMINI

# Configuration de l API OpenRouter
openrouter.api.key=VOTRE KEY OPENROUTER
# Proxy du réseau pour joindre les API d IA (vide = connexion directe)
ia.proxy=

# Ajoute une empreinte aux URL des CSS/JS : le navigateur recharge les fichiers dès qu ils changent
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
