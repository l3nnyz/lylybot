<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layoutApp(~{::title}, ~{::div.app})}">
<head>
    <title>Lylybot</title>
</head>
<body>
<div class="app" id="app" th:classappend="${conversation != null} ? 'en-cours'" th:attr="data-conv=${conversation != null} ? ${conversation.id}">

    <aside class="app-side">
        <div class="app-side-haut">
            <a href="/chat" th:href="@{/chat}" class="app-side-logo">
                <img src="/img/logo.png" th:src="@{/img/logo.png}" alt="Lylybot">
            </a>
            <button type="button" class="app-icone" id="btn-menu" aria-label="Réduire le menu" aria-expanded="true"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        </div>

        <a href="/chat" th:href="@{/chat}" class="app-new" id="btn-nouvelle"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l5 5L9 20H4v-5L15 4z"/><path d="M13 6l5 5"/></svg> Nouvelle conversation</a>

        <div class="app-historique" id="historique">
            <div class="app-groupe" id="groupe-aujourdhui" th:if="${!#lists.isEmpty(aujourdhui)}">Aujourd'hui <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
            <div class="app-conv" th:each="c : ${aujourdhui}" th:classappend="${conversation != null and conversation.id == c.id} ? 'active'">
                <a href="#" class="app-conv-lien" th:href="@{/chat/{id}(id=${c.id})}" th:text="${c.titre}">Titre</a>
                <form method="post" action="#" th:action="@{/chat/{id}/supprimer(id=${c.id})}" data-confirme="Supprimer cette conversation ?"><button type="submit" class="app-conv-sup" aria-label="Supprimer la conversation" title="Supprimer"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button></form>
            </div>
            <div class="app-groupe" th:if="${!#lists.isEmpty(avant)}">Hier et avant <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div>
            <div class="app-conv" th:each="c : ${avant}" th:classappend="${conversation != null and conversation.id == c.id} ? 'active'">
                <a href="#" class="app-conv-lien" th:href="@{/chat/{id}(id=${c.id})}" th:text="${c.titre}">Titre</a>
                <form method="post" action="#" th:action="@{/chat/{id}/supprimer(id=${c.id})}" data-confirme="Supprimer cette conversation ?"><button type="submit" class="app-conv-sup" aria-label="Supprimer la conversation" title="Supprimer"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button></form>
            </div>
            <div class="app-vide" th:if="${#lists.isEmpty(aujourdhui) and #lists.isEmpty(avant)}">Aucune conversation</div>
        </div>

        <div class="app-compte" th:text="${email}" title="Compte connecté">compte@exemple.fr</div>

        <nav class="app-menu app-menu-bas">
            <a href="/admin" th:href="@{/admin}" th:if="${estAdmin}"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg> Administration</a>
            <form method="post" action="/logout" th:action="@{/logout}"><button type="submit"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Déconnexion</button></form>
        </nav>
    </aside>

    <section class="app-main">
        <div class="app-top">
            <label class="app-select-wrap">
                <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>
                <select class="app-select" id="fournisseur" name="idFournisseur" form="formulaire" aria-label="Fournisseur d'IA"
                        th:disabled="${conversation != null}"
                        th:title="${conversation != null} ? 'Le fournisseur est fixé pour cette conversation'">
                    <option th:each="f : ${fournisseurs}" th:value="${f.id}" th:text="${f.nom}"
                            th:selected="${fournisseurConversation != null and fournisseurConversation.id == f.id}">fournisseur</option>
                </select>
            </label>
        </div>

        <template id="modele-frappe"><div class="msg msg-frappe"><img src="/img/loading.gif" th:src="@{/img/loading.gif}" alt="Réponse en cours"></div></template>
        <img src="/img/loading.gif" th:src="@{/img/loading.gif}" alt="" hidden>
        <div class="app-fil" id="fil" aria-live="polite">
            <th:block th:each="m : ${messages}">
                <div class="msg msg-moi" th:if="${m.typeMessage.name() == 'UTILISATEUR'}" th:text="${m.contenu}"></div>
                <div class="msg-groupe" th:if="${m.typeMessage.name() == 'ASSISTANT'}">
                    <div class="msg msg-ia" th:text="${m.contenu}"></div>
                    <button type="button" class="msg-copier" title="Copier la réponse" aria-label="Copier la réponse"></button>
                </div>
            </th:block>
            <div class="msg msg-erreur" role="alert" th:if="${erreur}" th:text="${erreur}">Erreur</div>
        </div>

        <div class="app-centre">
            <div id="logo3d" class="app-3d" aria-hidden="true">
                <canvas></canvas>
                <img class="app-3d-repli" src="/img/pictogramme.png" th:src="@{/img/pictogramme.png}" alt="">
            </div>
            <h1 class="app-titre">Que puis-je faire pour vous ?</h1>

            <form class="app-saisie" id="formulaire" method="post" action="/chat"
                  th:action="${conversation == null} ? @{/chat} : @{/chat/{id}/messages(id=${conversation.id})}">
                <textarea id="saisie" name="prompt" rows="1" required placeholder="Demandez n'importe quoi" aria-label="Votre message"></textarea>
                <div class="app-saisie-bas">
                    <button type="submit" class="app-envoyer" id="btn-envoyer" disabled>Envoyer <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
                </div>
            </form>

            <div class="app-suggestions" id="suggestions">
                <button type="button" class="app-pastille" data-texte="Résume ce texte : "><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg> Résumer</button>
                <button type="button" class="app-pastille" data-texte="Traduis en anglais : "><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 7 8M12 5c0 4-3 7-7 8M14 21l4-9 4 9M15.5 18h5"/></svg> Traduire</button>
                <button type="button" class="app-pastille" data-texte="Rédige un message pour "><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Rédiger</button>
                <button type="button" class="app-pastille" data-texte="Corrige ce texte : "><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg> Corriger</button>
            </div>
        </div>

    </section>

    <script type="module" src="/js/accueil3d.js" th:src="@{/js/accueil3d.js}"></script>
    <script src="/vendor/js/marked.umd.js" th:src="@{/vendor/js/marked.umd.js}"></script>
    <script src="/vendor/js/purify.min.js" th:src="@{/vendor/js/purify.min.js}"></script>
    <script src="/js/chat.js" th:src="@{/js/chat.js}"></script>
</div>
</body>
</html>
